name: CI

on:
  push:
    branches: ["main", "mvp/**"]
  pull_request:

jobs:
  rust-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Steam no-launch-promise docs
        run: python3 scripts/qa/no_launch_promise_lint.py
      - name: Check workspace
        run: cargo check --workspace
      - name: Check generated contracts
        run: scripts/contracts/check_contracts.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-unit:
    needs: rust-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace

  creator-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget
      - name: Install frontend dependencies
        run: npm ci
      - name: Run creator desktop QA
        run: npm run creator-desktop:qa
      - name: Run player web QA
        run: npm run player-web:qa

  cli-smoke:
    needs: rust-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run CLI smoke in tempdir
        run: |
          tmp="$(mktemp -d)"
          cargo run -p plotforge-cli -- new project --path "$tmp/starter-project" --force --concept "A local starter project for CI." --visual-style "clear readable test style" --initial-scene "A creator opens a fresh PlotForge project."
          cargo run -p plotforge-cli -- check "$tmp/starter-project"
          cargo run -p plotforge-cli -- play "$tmp/starter-project" --once
          cargo run -p plotforge-cli -- trace inspect "$tmp/starter-project/traces/latest.json"
          cargo run -p plotforge-cli -- export static "$tmp/starter-project" --out "$tmp/export"

  export-smoke:
    needs: rust-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build static export
        run: |
          tmp="$(mktemp -d)"
          cargo run -p plotforge-cli -- new project --path "$tmp/starter-project" --force --concept "A local starter project for CI." --visual-style "clear readable test style" --initial-scene "A creator opens a fresh PlotForge project."
          cargo run -p plotforge-cli -- export static "$tmp/starter-project" --out "$tmp/export"
          python3 scripts/qa/static_export_http_smoke.py --export-dir "$tmp/export"
