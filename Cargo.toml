[workspace]
members = [
  "crates/plotforge-agent",
  "crates/plotforge-cli",
  "crates/plotforge-export",
  "crates/plotforge-job",
  "crates/plotforge-media",
  "crates/plotforge-rule",
  "crates/plotforge-runtime",
  "crates/plotforge-schema",
  "crates/plotforge-studio",
  "crates/plotforge-storage",
  "crates/plotforge-storycraft",
  "crates/plotforge-workshop",
]
exclude = ["apps/creator-desktop/src-tauri"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
repository = "https://github.com/zhu1090093659/plotforge"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
dirs = "5"
plotforge-agent = { path = "crates/plotforge-agent" }
plotforge-export = { path = "crates/plotforge-export" }
plotforge-job = { path = "crates/plotforge-job" }
plotforge-media = { path = "crates/plotforge-media" }
plotforge-rule = { path = "crates/plotforge-rule" }
plotforge-runtime = { path = "crates/plotforge-runtime" }
plotforge-schema = { path = "crates/plotforge-schema" }
plotforge-studio = { path = "crates/plotforge-studio" }
plotforge-storage = { path = "crates/plotforge-storage" }
plotforge-storycraft = { path = "crates/plotforge-storycraft" }
plotforge-workshop = { path = "crates/plotforge-workshop" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
schemars = "1.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
rusqlite = { version = "0.37.0", features = ["bundled"] }
tempfile = "3.10"
thiserror = "2.0"
toml = "0.9"
zip = { version = "4.6.1", default-features = false }
